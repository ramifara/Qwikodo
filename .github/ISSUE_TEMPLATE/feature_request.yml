name: Feature request
description: Propose a focused, local-first improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What scanner workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, permissions, and size impact
      description: Note any new data, permission, network behavior, or runtime dependency involved.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This keeps scanning local and does not require an account, telemetry, or advertising.
          required: true
