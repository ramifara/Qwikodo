name: Bug report
description: Report a reproducible problem in Qwikodo
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not post secrets, private barcode contents, or security vulnerabilities here. Follow
        SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: Qwikodo version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and desktop environment
      placeholder: macOS 15.6, Windows 11 24H2, or Ubuntu 24.04 / GNOME / Wayland
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Scan source
      options:
        - File or drag and drop
        - Camera
        - Clipboard
        - Screen
        - History or result actions
        - Application startup or build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a non-sensitive sample image when one is needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
