name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          EXPECTED_TAG="${tag}" npm run check:versions

  release:
    name: Package ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      # A referenced secret that isn't configured evaluates to an empty
      # string, not "unset" — so this is only "true" when every Apple
      # signing secret actually has a value.
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            # See the matching comment in ci.yml: needs PipeWire/SPA headers
            # newer than ubuntu-22.04 ships for xcap's libspa 0.10 dependency.
            platform: ubuntu-24.04
            rust-target: ""
            args: --bundles appimage,deb,rpm
          - name: Windows x64
            platform: windows-latest
            rust-target: ""
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tauri
        with:
          rust-target: ${{ matrix.rust-target }}

      # tauri-action/tauri-bundler treat an *empty-but-present* APPLE_CERTIFICATE
      # as "please sign" and try to import it into a keychain, which fails
      # outright. So these are two separate steps rather than one step with
      # conditionally-empty env values: the unsigned path never sets the
      # Apple env vars at all, not even to "".
      - name: Build draft release (signed)
        if: ${{ runner.os == 'macOS' && env.HAS_APPLE_SECRETS == 'true' }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Qwikodo ${{ needs.prepare.outputs.tag }}
          releaseBody: >-
            Automated release. macOS artifacts are signed and notarized with a Developer ID when
            the signing secrets are configured, otherwise ad-hoc signed. Windows artifacts are
            unsigned; verify downloaded artifacts before distributing them.
          releaseDraft: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: Build draft release (unsigned)
        if: ${{ !(runner.os == 'macOS' && env.HAS_APPLE_SECRETS == 'true') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Qwikodo ${{ needs.prepare.outputs.tag }}
          releaseBody: >-
            Automated release. macOS artifacts are signed and notarized with a Developer ID when
            the signing secrets are configured, otherwise ad-hoc signed. Windows artifacts are
            unsigned; verify downloaded artifacts before distributing them.
          releaseDraft: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  publish:
    name: Publish GitHub release
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

  winget:
    name: Update winget manifest
    needs: [prepare, publish]
    runs-on: windows-latest
    timeout-minutes: 15
    # Requires a one-time `wingetcreate` submission of RamiFara.Qwikodo and a
    # WINGET_PAT repo secret (a classic PAT with public_repo scope). Until
    # both exist, this job's step is a no-op rather than a failure.
    # (`secrets` can't be referenced in a job-level `if:` — GitHub rejects the
    # whole workflow file if you try — so the guard lives on the step instead,
    # via a job-level env var that steps' `if:` is allowed to read.)
    env:
      WINGET_PAT: ${{ secrets.WINGET_PAT }}
    steps:
      - name: Update winget manifest
        if: ${{ env.WINGET_PAT != '' }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: RamiFara.Qwikodo
          installers-regex: '-setup\.exe$'
          version: ${{ needs.prepare.outputs.tag }}
          token: ${{ env.WINGET_PAT }}

  homebrew:
    name: Update Homebrew cask
    needs: [prepare, publish]
    runs-on: macos-latest
    timeout-minutes: 10
    # Requires a RamiFara/homebrew-tap repo and a TAP_PUSH_TOKEN secret (a
    # classic PAT with repo scope on that tap). Until both exist, every step
    # below is a no-op rather than a failure (see the `winget` job above for
    # why the guard is per-step instead of a job-level `if:`).
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout tap
        if: ${{ env.TAP_PUSH_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: RamiFara/homebrew-tap
          token: ${{ env.TAP_PUSH_TOKEN }}
          path: tap

      - name: Download release dmgs and compute checksums
        if: ${{ env.TAP_PUSH_TOKEN != '' }}
        id: sha
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir dmg
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dmg \
            --pattern "*aarch64*.dmg" --pattern "*x64*.dmg"
          {
            echo "version=${version}"
            echo "arm_sha=$(shasum -a 256 dmg/*aarch64*.dmg | cut -d' ' -f1)"
            echo "intel_sha=$(shasum -a 256 dmg/*x64*.dmg | cut -d' ' -f1)"
          } >> "${GITHUB_OUTPUT}"

      - name: Render and push cask
        if: ${{ env.TAP_PUSH_TOKEN != '' }}
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.sha.outputs.intel_sha }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/qwikodo.rb <<CASK
          cask "qwikodo" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/Qwikodo_${VERSION}_aarch64.dmg"
            end
            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/Qwikodo_${VERSION}_x64.dmg"
            end

            name "Qwikodo"
            desc "Small, private, offline QR code and barcode scanner"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "Qwikodo.app"
          end
          CASK
          cd tap
          git config user.name "qwikodo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/qwikodo.rb
          git diff --cached --quiet || git commit -m "qwikodo ${TAG_NAME}"
          git push
