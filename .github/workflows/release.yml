name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          EXPECTED_TAG="${tag}" npm run check:versions

  release:
    name: Package ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust-target: ""
            args: --bundles appimage
          - name: Windows x64
            platform: windows-latest
            rust-target: ""
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tauri
        with:
          rust-target: ${{ matrix.rust-target }}

      - name: Build draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Qwikodo ${{ needs.prepare.outputs.tag }}
          releaseBody: >-
            Automated release. macOS artifacts use an ad-hoc signature and Windows artifacts are
            unsigned; verify downloaded artifacts before distributing them.
          releaseDraft: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  publish:
    name: Publish GitHub release
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
