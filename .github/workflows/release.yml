name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          EXPECTED_TAG="${tag}" npm run check:versions

  release:
    name: Package ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust-target: ""
            args: --bundles appimage,deb,rpm
          - name: Windows x64
            platform: windows-latest
            rust-target: ""
            args: --bundles nsis
          - name: macOS Apple Silicon
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tauri
        with:
          rust-target: ${{ matrix.rust-target }}

      - name: Build draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only set on macOS runners; tauri-action/tauri-bundler notarize and
          # sign with a Developer ID only when these are all present, so
          # Linux/Windows legs build ad-hoc/unsigned exactly as before.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Qwikodo ${{ needs.prepare.outputs.tag }}
          releaseBody: >-
            Automated release. macOS artifacts are signed and notarized with a Developer ID when
            the signing secrets are configured, otherwise ad-hoc signed. Windows artifacts are
            unsigned; verify downloaded artifacts before distributing them.
          releaseDraft: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}

  publish:
    name: Publish GitHub release
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest

  winget:
    name: Update winget manifest
    needs: [prepare, publish]
    runs-on: windows-latest
    timeout-minutes: 15
    # Requires a one-time `wingetcreate` submission of RamiFara.Qwikodo and a
    # WINGET_PAT repo secret (a classic PAT with public_repo scope). Until
    # both exist, this job is a no-op rather than a failure.
    if: ${{ secrets.WINGET_PAT != '' }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: RamiFara.Qwikodo
          installers-regex: '-setup\.exe$'
          version: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.WINGET_PAT }}

  homebrew:
    name: Update Homebrew cask
    needs: [prepare, publish]
    runs-on: macos-latest
    timeout-minutes: 10
    # Requires a RamiFara/homebrew-tap repo and a TAP_PUSH_TOKEN secret (a
    # classic PAT with repo scope on that tap). Until both exist, this job is
    # a no-op rather than a failure.
    if: ${{ secrets.TAP_PUSH_TOKEN != '' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: RamiFara/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      - name: Download release dmgs and compute checksums
        id: sha
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir dmg
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dmg \
            --pattern "*aarch64*.dmg" --pattern "*x64*.dmg"
          {
            echo "version=${version}"
            echo "arm_sha=$(shasum -a 256 dmg/*aarch64*.dmg | cut -d' ' -f1)"
            echo "intel_sha=$(shasum -a 256 dmg/*x64*.dmg | cut -d' ' -f1)"
          } >> "${GITHUB_OUTPUT}"

      - name: Render and push cask
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          ARM_SHA: ${{ steps.sha.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.sha.outputs.intel_sha }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/qwikodo.rb <<CASK
          cask "qwikodo" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/Qwikodo_${VERSION}_aarch64.dmg"
            end
            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/Qwikodo_${VERSION}_x64.dmg"
            end

            name "Qwikodo"
            desc "Small, private, offline QR code and barcode scanner"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "Qwikodo.app"
          end
          CASK
          cd tap
          git config user.name "qwikodo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/qwikodo.rb
          git diff --cached --quiet || git commit -m "qwikodo ${TAG_NAME}"
          git push
